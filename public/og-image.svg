<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Haphazard.dev developer tools by Corwin</title>
  <desc id="desc">A terminal-inspired social preview card for Haphazard.dev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100c"/>
      <stop offset="0.55" stop-color="#08130f"/>
      <stop offset="1" stop-color="#050907"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.18" cy="0.08" r="0.72">
      <stop offset="0" stop-color="#65ff9f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#65ff9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.88" cy="0.14" r="0.58">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#80ffb1" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(72 72)" filter="url(#shadow)">
    <rect width="1056" height="486" rx="28" fill="#091610" fill-opacity="0.88" stroke="#80ffb1" stroke-opacity="0.22"/>
    <rect width="1056" height="64" rx="28" fill="#ffffff" fill-opacity="0.035"/>
    <path d="M0 64H1056" stroke="#80ffb1" stroke-opacity="0.18"/>
    <circle cx="34" cy="32" r="8" fill="#ff5f57"/>
    <circle cx="62" cy="32" r="8" fill="#ffd166"/>
    <circle cx="90" cy="32" r="8" fill="#65ff9f"/>

    <text x="42" y="133" fill="#65ff9f" font-family="Courier New" font-size="24" font-weight="700">~/haphazard.dev</text>
    <text x="42" y="235" fill="#e9fff2" font-family="Arial" font-size="86" font-weight="850" letter-spacing="-4">Developer tools</text>
    <text x="42" y="320" fill="#e9fff2" font-family="Arial" font-size="86" font-weight="850" letter-spacing="-4">for editor and</text>
    <text x="42" y="405" fill="#e9fff2" font-family="Arial" font-size="86" font-weight="850" letter-spacing="-4">terminal workflows</text>

    <text x="42" y="462" fill="#91b79f" font-family="Courier New" font-size="24">VS Code extensions · CLIs · tmux integrations · pi experiments</text>
  </g>
</svg>
